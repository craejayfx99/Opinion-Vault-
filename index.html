<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Opinion Vault - Admin Dashboard</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-color: #c9d1d9;
      --accent-color: #238636;
      --accent-hover: #2ea043;
      --danger-color: #da3633;
      --edit-color: #1f6beb;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1, h2, h3 { color: #fff; }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .grid-form {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .full-width { grid-column: span 2; }

    label {
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
      color: #8b949e;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      box-sizing: border-box;
      font-size: 14px;
    }

    textarea {
      resize: vertical;
      min-height: 60px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 14px;
    }

    .btn-primary { background: var(--accent-color); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: #30363d; color: #fff; }
    .btn-edit { background: var(--edit-color); color: #fff; }
    .btn-danger { background: var(--danger-color); color: #fff; }

    .offers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 20px;
    }

    .offer-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .offer-cover {
      width: 100%;
      height: 160px;
      object-fit: cover;
      background-color: #21262d;
    }

    .offer-body {
      padding: 15px;
      flex-grow: 1;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      font-size: 11px;
      border-radius: 12px;
      font-weight: bold;
      margin-right: 5px;
      text-transform: uppercase;
    }

    .badge-active { background: #238636; color: #fff; }
    .badge-paused { background: #d29922; color: #fff; }
    .badge-inactive { background: #6e7681; color: #fff; }

    .meta-tag {
      font-size: 12px;
      color: #8b949e;
      margin-top: 5px;
    }

    .offer-actions {
      padding: 10px 15px;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      background: #0d1117;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Opinion Vault Admin Dashboard</h1>

  <!-- Form Section for Adding & Editing Offers -->
  <div class="form-card" id="formContainer">
    <h2 id="formTitle">Add New Offer</h2>
    <form id="offerForm">
      <input type="hidden" id="editIndex" value="">

      <div class="grid-form">
        <div>
          <label>1. Title</label>
          <input type="text" id="offerTitle" required placeholder="e.g. Premium Survey Task">
        </div>

        <div>
          <label>2. Category</label>
          <input type="text" id="offerCategory" required placeholder="e.g. Surveys, Games, Apps">
        </div>

        <div>
          <label>3. Status</label>
          <select id="offerStatus">
            <option value="Active">Active</option>
            <option value="Paused">Paused</option>
            <option value="Inactive">Inactive</option>
          </select>
        </div>

        <div>
          <label>4. Target Country</label>
          <input type="text" id="offerCountry" required placeholder="e.g. US, UK, CA, Global">
        </div>

        <div>
          <label>5. Target Device</label>
          <select id="offerDevice">
            <option value="All Devices">All Devices</option>
            <option value="iOS">iOS</option>
            <option value="Android">Android</option>
            <option value="Desktop">Desktop</option>
          </select>
        </div>

        <div>
          <label>6. Reward / Rate ($)</label>
          <input type="text" id="offerReward" required placeholder="e.g. $5.00 / offer">
        </div>

        <div>
          <label>7. Payout / Points</label>
          <input type="text" id="offerPayout" required placeholder="e.g. 500 Points">
        </div>

        <div>
          <label>8. Offer / Target URL</label>
          <input type="url" id="offerLink" placeholder="https://example.com/offer-link">
        </div>

        <div class="full-width">
          <label>9. Cover Image URL</label>
          <input type="url" id="offerCover" placeholder="https://i.postimg.cc/your-image.png">
        </div>

        <div class="full-width">
          <label>10. Requirements / Instructions</label>
          <textarea id="offerRequirements" placeholder="e.g. Complete registration and reach Level 5..."></textarea>
        </div>

        <div class="full-width">
          <label>11. Description</label>
          <textarea id="offerDesc" required placeholder="Write a short offer description..."></textarea>
        </div>

        <div class="full-width">
          <label>12. Feedbacks / Admin Notes</label>
          <textarea id="offerFeedbacks" placeholder="User feedback or internal administrator notes..."></textarea>
        </div>
      </div>

      <div class="btn-group full-width">
        <button type="submit" id="submitBtn" class="btn-primary">Add Offer</button>
        <button type="button" id="cancelBtn" class="btn-secondary" style="display:none;" onclick="cancelEdit()">Cancel Edit</button>
      </div>
    </form>
  </div>

  <!-- Display Section for Offers -->
  <h2>Current Offers</h2>
  <div class="offers-grid" id="offersList"></div>
</div>

<script>
  let offers = JSON.parse(localStorage.getItem('opinion_vault_offers')) || [];

  function renderOffers() {
    const listContainer = document.getElementById('offersList');
    listContainer.innerHTML = '';

    if (offers.length === 0) {
      listContainer.innerHTML = '<p style="color:#8b949e;">No offers created yet. Use the form above to add one.</p>';
      return;
    }

    offers.forEach((offer, index) => {
      const card = document.createElement('div');
      card.className = 'offer-card';

      const statusBadge = offer.status === 'Active' ? 'badge-active' : (offer.status === 'Paused' ? 'badge-paused' : 'badge-inactive');
      const coverUrl = offer.cover || 'https://via.placeholder.com/400x160?text=No+Cover+Image';

      card.innerHTML = `
        <img src="${coverUrl}" class="offer-cover" alt="Cover Image" onerror="this.src='https://via.placeholder.com/400x160?text=Image+Error'">
        <div class="offer-body">
          <span class="badge ${statusBadge}">${offer.status}</span>
          <span class="meta-tag">🏷️ ${offer.category}</span>
          <h3 style="margin: 10px 0 5px 0;">${offer.title}</h3>
          <p style="font-size:13px; color:#8b949e; margin-bottom:10px;">${offer.desc}</p>

          <div class="meta-tag"><strong>🌍 Country:</strong> ${offer.country}</div>
          <div class="meta-tag"><strong>📱 Device:</strong> ${offer.device}</div>
          <div class="meta-tag"><strong>💵 Reward Rate:</strong> ${offer.reward}</div>
          <div class="meta-tag"><strong>🪙 Payout/Points:</strong> ${offer.payout}</div>
          ${offer.link ? `<div class="meta-tag"><strong>🔗 Offer Link:</strong> <a href="${offer.link}" target="_blank" style="color:#1f6beb;">${offer.link}</a></div>` : ''}
          ${offer.requirements ? `<div class="meta-tag" style="margin-top:6px;"><strong>📋 Requirements:</strong> ${offer.requirements}</div>` : ''}
          ${offer.feedbacks ? `<div class="meta-tag" style="margin-top:8px; border-top:1px dashed #30363d; padding-top:5px;"><strong>💬 Feedbacks:</strong> ${offer.feedbacks}</div>` : ''}
        </div>
        <div class="offer-actions">
          <button class="btn-edit" onclick="startEdit(${index})">Edit</button>
          <button class="btn-danger" onclick="deleteOffer(${index})">Delete</button>
        </div>
      `;

      listContainer.appendChild(card);
    });
  }

  function saveStorage() {
    localStorage.setItem('opinion_vault_offers', JSON.stringify(offers));
    renderOffers();
  }

  document.getElementById('offerForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const editIndex = document.getElementById('editIndex').value;
    const newOffer = {
      title: document.getElementById('offerTitle').value.trim(),
      category: document.getElementById('offerCategory').value.trim(),
      status: document.getElementById('offerStatus').value,
      country: document.getElementById('offerCountry').value.trim(),
      device: document.getElementById('offerDevice').value,
      reward: document.getElementById('offerReward').value.trim(),
      payout: document.getElementById('offerPayout').value.trim(),
      link: document.getElementById('offerLink').value.trim(),
      cover: document.getElementById('offerCover').value.trim(),
      requirements: document.getElementById('offerRequirements').value.trim(),
      desc: document.getElementById('offerDesc').value.trim(),
      feedbacks: document.getElementById('offerFeedbacks').value.trim()
    };

    if (editIndex !== '') {
      offers[editIndex] = newOffer;
    } else {
      offers.push(newOffer);
    }

    saveStorage();
    cancelEdit();
  });

  function startEdit(index) {
    const offer = offers[index];
    document.getElementById('editIndex').value = index;
    document.getElementById('offerTitle').value = offer.title || '';
    document.getElementById('offerCategory').value = offer.category || '';
    document.getElementById('offerStatus').value = offer.status || 'Active';
    document.getElementById('offerCountry').value = offer.country || '';
    document.getElementById('offerDevice').value = offer.device || 'All Devices';
    document.getElementById('offerReward').value = offer.reward || '';
    document.getElementById('offerPayout').value = offer.payout || '';
    document.getElementById('offerLink').value = offer.link || '';
    document.getElementById('offerCover').value = offer.cover || '';
    document.getElementById('offerRequirements').value = offer.requirements || '';
    document.getElementById('offerDesc').value = offer.desc || '';
    document.getElementById('offerFeedbacks').value = offer.feedbacks || '';

    document.getElementById('formTitle').innerText = 'Edit Offer #' + (index + 1);
    document.getElementById('submitBtn').innerText = 'Save Changes';
    document.getElementById('cancelBtn').style.display = 'inline-block';

    document.getElementById('formContainer').scrollIntoView({ behavior: 'smooth' });
  }

  function cancelEdit() {
    document.getElementById('editIndex').value = '';
    document.getElementById('offerForm').reset();
    document.getElementById('formTitle').innerText = 'Add New Offer';
    document.getElementById('submitBtn').innerText = 'Add Offer';
    document.getElementById('cancelBtn').style.display = 'none';
  }

  function deleteOffer(index) {
    if (confirm('Are you sure you want to delete this offer?')) {
      offers.splice(index, 1);
      saveStorage();
      cancelEdit();
    }
  }

  renderOffers();
</script>

</body>
</html>
